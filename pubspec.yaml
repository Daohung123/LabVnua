name: aqedu
description: "A Flutter student academic companion for VNUA students."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  mobile_scanner: ^7.0.1
  flutter_html: ^3.0.0
  flutter:
    sdk: flutter
  diacritic: ^0.1.5

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  crypto: ^3.0.6
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+3
  google_generative_ai: ^0.4.0
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^6.0.5

dev_dependencies:
  connectivity_plus: ^6.0.5
  app_settings: ^5.1.1
  rename: ^2.1.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"


  
